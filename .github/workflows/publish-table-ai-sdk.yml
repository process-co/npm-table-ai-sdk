name: "Publish Table AI SDK"

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./package.json').version")
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Prepare package manifest
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm pkg set "version=${RELEASE_VERSION}"
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f SOURCE_COMMIT
          ! grep -R "workspace:" package.json
          npm pack --dry-run
      - name: Publish public package
        run: npm publish --access public
      - name: Verify fresh ESM and CommonJS consumers
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          package="@process.co/table-ai-sdk@${RELEASE_VERSION}"
          for attempt in {1..20}; do
            if npm view "$package" version --json >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              echo "::error::${package} was not visible in the npm registry after 100 seconds"
              exit 1
            fi
            echo "Waiting for ${package} to become visible in the npm registry (${attempt}/20)"
            sleep 5
          done

          consumer="${RUNNER_TEMP}/table-ai-sdk-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes
          npm install \
            "$package" \
            "ai@^6"
          node --input-type=module --eval \
            "await import('@process.co/table-ai-sdk')"
          node --eval "require('@process.co/table-ai-sdk')"
